name: Verify Columbus text export (read only)
on:
  push:
    branches: [recovery/columbus-text-20261124]
permissions:
  contents: read
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: b207fb4e80206d38bd925cd7c54bc6e3245ae872
          fetch-depth: 0
          persist-credentials: false
      - name: Rebuild with pinned browser compiler and report verified output
        shell: bash
        run: |
          python3 - <<'PY'
          import functools, hashlib, http.server, json, os, pathlib, shutil, subprocess, tempfile, threading, zipfile
          
          root = pathlib.Path.cwd()
          source = "b207fb4e80206d38bd925cd7c54bc6e3245ae872"
          expected_main = "85c12c19c8ef509c3646f6d1a0d8062d8f47e10e"
          expected_tree = "dde4095b25937c294bb69c92d0b4def39a6fec56"
          def git(*args):
              return subprocess.check_output(["git", *args], text=True).strip()
          assert git("rev-parse", "HEAD") == source
          assert git("diff", "--name-only", expected_main, source).splitlines() == [
              "chapters/columbus-first-voyage/de.md",
              "chapters/columbus-first-voyage/en.md",
          ]
          subprocess.run(["sha256sum", "-c", "tooling.sha256", "--quiet"], check=True)
          
          with tempfile.TemporaryDirectory(prefix="atlas-export-") as directory:
              temp = pathlib.Path(directory)
              archive = temp / "source.zip"
              subprocess.run(["git", "archive", "--format=zip", "--output=" + str(archive), source,
                              "dataset.json", "entities", "assertions", "events", "geometries",
                              "sources", "interpretations", "assets", "chapters", "packages"], check=True)
              html = """<!doctype html><html><body><p id="status">Compiling committed source in Chromium</p>
          <script type="module">
          import {Workspace} from '/tooling/tools/workspace.js';
          import {buildContent} from '/tooling/tools/build.js';
          try {
            const input = new Uint8Array(await (await fetch('/__source.zip')).arrayBuffer());
            const workspace = await Workspace.fromZip(input);
            const result = await buildContent(workspace, 'draft', SOURCE_REVISION_VALUE);
            const validation = JSON.parse(await result.files.readFile('validation.json', 'utf8'));
            const output = await fetch('/__published.zip', {method:'POST', body:result.files.zip()});
            if (!output.ok) throw new Error('Export transfer failed');
            await fetch('/__result.json', {method:'POST', body:JSON.stringify({
              sourceRevision: result.catalog.sourceRevision,
              dataReleaseId: result.catalog.dataReleaseId,
              ...validation
            })});
            document.querySelector('#status').textContent = 'Export complete';
          } catch (error) {
            await fetch('/__result.json', {method:'POST', body:JSON.stringify({error:String(error.stack || error)})});
          }
          </script></body></html>""".replace("SOURCE_REVISION_VALUE", json.dumps(source))
              (temp / "export.html").write_text(html)
              complete = threading.Event()
              class Handler(http.server.SimpleHTTPRequestHandler):
                  def log_message(self, *args):
                      pass
                  def do_GET(self):
                      mapping = {"/__export.html": ("export.html", "text/html"), "/__source.zip": ("source.zip", "application/zip")}
                      if self.path in mapping:
                          name, kind = mapping[self.path]
                          data = (temp / name).read_bytes()
                          self.send_response(200)
                          self.send_header("Content-Type", kind)
                          self.send_header("Content-Length", str(len(data)))
                          self.end_headers()
                          self.wfile.write(data)
                      else:
                          super().do_GET()
                  def do_POST(self):
                      if self.path not in ["/__published.zip", "/__result.json"]:
                          self.send_error(404)
                          return
                      count = int(self.headers.get("Content-Length", "0"))
                      assert 0 < count < 256 * 1024 * 1024
                      target = temp / ("published.zip" if self.path == "/__published.zip" else "result.json")
                      target.write_bytes(self.rfile.read(count))
                      self.send_response(200)
                      self.end_headers()
                      self.wfile.write(b"ok")
                      if self.path == "/__result.json":
                          complete.set()
              server = http.server.ThreadingHTTPServer(("127.0.0.1", 0), functools.partial(Handler, directory=str(root)))
              threading.Thread(target=server.serve_forever, daemon=True).start()
              chrome = next((shutil.which(name) for name in ["google-chrome", "google-chrome-stable", "chromium", "chromium-browser"] if shutil.which(name)), None)
              assert chrome, "No installed Chromium browser"
              with (temp / "browser.log").open("w") as log:
                  process = subprocess.Popen([chrome, "--headless", "--no-sandbox", "--disable-dev-shm-usage",
                      "--disable-background-networking", "--user-data-dir=" + str(temp / "profile"),
                      "--remote-debugging-port=0", "http://127.0.0.1:" + str(server.server_port) + "/__export.html"],
                      stdout=log, stderr=log)
                  try:
                      assert complete.wait(150), "Browser export timed out"
                  finally:
                      process.terminate()
                      try:
                          process.wait(timeout=10)
                      except subprocess.TimeoutExpired:
                          process.kill()
                          process.wait()
                      server.shutdown()
              report = json.loads((temp / "result.json").read_text())
              print(json.dumps(report, ensure_ascii=False, indent=2), flush=True)
              assert "error" not in report, report
              assert report["sourceRevision"] == source
              assert report["dataReleaseId"] == "draft-42d550f4af377ac03358"
              assert report["records"] == 1088 and report["errors"] == report["warnings"] == 0
              with zipfile.ZipFile(temp / "published.zip") as exported:
                  for item in exported.infolist():
                      relative = pathlib.PurePosixPath(item.filename)
                      assert not relative.is_absolute() and ".." not in relative.parts
                      target = root / "published" / relative
                      if item.is_dir():
                          target.mkdir(parents=True, exist_ok=True)
                      else:
                          target.parent.mkdir(parents=True, exist_ok=True)
                          target.write_bytes(exported.read(item))
          subprocess.run(["python3", "scripts/check-published.py"], check=True)
          catalog = json.loads((root / "published/catalog.json").read_text())
          entry = next(x for x in catalog["files"] if x["role"] == "records" and x["path"].startswith("files/columbus-first-voyage-"))
          records = json.loads((root / "published" / entry["path"]).read_text())["records"]
          chapter = records["chapter:columbus-first-voyage"]
          asset = json.loads((root / "assets/models/santa-maria-reconstruction/asset.json").read_text())
          assert asset["id"] in chapter["recordIds"] + chapter["focusIds"]
          assert records[asset["id"]]["assetType"] == "model"
          for language, removed in [("de", "## Die Santa María in 3D"), ("en", "## The Santa María in 3D")]:
              canonical = (root / "chapters/columbus-first-voyage" / (language + ".md")).read_bytes()
              published = (root / "published" / chapter["textFiles"][language]).read_bytes()
              assert canonical == published and removed.encode() not in published
              print(language + ": requested section absent, canonical and published text identical")
          print("Santa Maria model remains a chapter member and a published model record")
          assert not git("diff", "--name-only", "--", ".", ":!published")
          subprocess.run(["git", "add", "published"], check=True)
          assert git("write-tree") == expected_tree, "Export differs from the previously recovered export tree"
          subprocess.run(["git", "diff", "--cached", "--check"], check=True)
          assert not git("diff", "--cached", "--name-only", "--diff-filter=D"), "Prior payload files must be retained"
          import re
          old_catalog = json.loads(git("show", source + ":published/catalog.json"))
          def logical(path):
              return re.sub(r"-[a-f0-9]{24}(?=\.[^.]+$)", "", path)
          old_paths = {logical(item["path"]): "published/" + item["path"] for item in old_catalog["files"]}
          def patches(before, after, path=None):
              path = [] if path is None else path
              if before == after:
                  return []
              if isinstance(before, dict) and isinstance(after, dict) and list(before) == list(after):
                  return [change for key in after for change in patches(before[key], after[key], path + [key])]
              if isinstance(before, list) and isinstance(after, list) and len(before) == len(after):
                  return [change for index in range(len(after)) for change in patches(before[index], after[index], path + [index])]
              return [{"path": path, "value": after}]
          manifest = {"sourceRevision": source, "expectedTree": expected_tree, "report": report, "files": []}
          for name in git("diff", "--cached", "--name-only").splitlines():
              raw = (root / name).read_text()
              base = name if name == "published/catalog.json" else old_paths[logical(name.removeprefix("published/"))]
              original = git("show", source + ":" + base)
              data = raw.encode()
              manifest["files"].append({
                  "path": name, "basePath": base, "patches": patches(json.loads(original), json.loads(raw)),
                  "pretty": raw.startswith("{\n") or raw.startswith("[\n"), "trailingNewline": raw.endswith("\n"),
                  "bytes": len(data), "blobSha": hashlib.sha1(b"blob " + str(len(data)).encode() + b"\0" + data).hexdigest()
              })
          transport = json.dumps(manifest, ensure_ascii=False, separators=(",", ":"))
          chunks = [transport[i:i+6000] for i in range(0, len(transport), 6000)]
          for index, chunk in enumerate(chunks):
              print("RECOVERY_CHUNK " + str(index+1) + "/" + str(len(chunks)) + " " + chunk, flush=True)
          print("READ_ONLY_EXPORT_VERIFIED", expected_tree, len(manifest["files"]), flush=True)
          
          PY
